name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pre-commit pytest
      - name: Pre-commit hooks
        # no-commit-to-branch guards local commits; CI also runs on pushes to main.
        run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
      - name: Commit messages and PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          # Dependabot's commits carry a changelog body. They never reach main, because a
          # squash merge uses only the title, which is still checked below.
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
              git log -1 --format=%B "$sha" | python scripts/check_commit_msg.py - || status=1
            done
          fi
          printf '%s\n' "$PR_TITLE" | python scripts/check_commit_msg.py - || status=1
          exit $status
      - run: pytest

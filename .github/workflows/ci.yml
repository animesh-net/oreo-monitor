name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pre-commit pytest
      - name: Pre-commit hooks
        # no-commit-to-branch guards local commits; CI also runs on pushes to main.
        run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
      - name: Commit messages and PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" | python scripts/check_commit_msg.py - || status=1
          done
          printf '%s\n' "$PR_TITLE" | python scripts/check_commit_msg.py - || status=1
          exit $status
      - run: pytest

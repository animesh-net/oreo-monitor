name: PR description

# Removes co-author, agent-session and "generated/requested by" lines from pull request
# descriptions. It edits silently: it never fails and never comments. Edits made with
# GITHUB_TOKEN do not start another run, so it cannot loop.
#
# Two triggers, one per kind of pull request:
# - pull_request for ours, the trigger that has always worked here.
# - pull_request_target for Dependabot's, because its pull_request runs only get a
#   read-only token. That is safe because nothing from the pull request is run: the
#   cleaner comes from main and the description is only read as text.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  description:
    if: >-
      (github.event_name == 'pull_request') ==
      (github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      # The cleaner always comes from main, so a branch that changes it cannot affect what
      # runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Tidy
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Read the description now, not from the event: it may have changed since.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > body.md
          # Exit 0: already clean. Exit 1: something was removed. Anything else means the
          # cleaner did not run, and the description is left exactly as it is. An empty
          # result is never saved.
          status=0
          python scripts/clean_pr_body.py < body.md > cleaned.md || status=$?
          if [ "$status" -eq 1 ] && [ -s cleaned.md ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -F body=@cleaned.md > /dev/null
          elif [ "$status" -gt 1 ]; then
            echo "Cleaner exited with $status; description left unchanged."
          fi
